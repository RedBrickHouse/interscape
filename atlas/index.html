<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>INTER•SCAPE</title>
  <link rel="canonical" href="https://redbrickhouse.gg/interscape/">
  <script>
    const home = new URL('../', location.href);
    const lang = new URL(location.href).searchParams.get('lang');
    if (['ko', 'en', 'zh'].includes(lang)) home.searchParams.set('lang', lang);
    const sections = {'#dream-atlas':'#lobby', '#play':'#gameplay', '#story':'#story', '#journal':'#journal', '#information':'#information'};
    home.hash = sections[location.hash] || '';
    location.replace(home);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
</head>
<body><a href="../">INTER•SCAPE 홈페이지</a></body>
</html>
